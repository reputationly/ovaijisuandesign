[workspace]
resolver = "2"
members = [
  "crates/maas-media",
  "crates/gateway",
  "apps/desktop",
]

[workspace.package]
version = "3.0.12"
edition = "2024"
repository = "https://github.com/reputationly/ovaijisuandesign"
# 个人学习研究用。仓库公开可读，但没有 license —— 默认版权保留，别人不能直接拿去用。
# `publish = false` 是为了让 `cargo publish` 直接失败，而不是等到上传前才发现没写 license。
publish = false

[workspace.dependencies]
anyhow = "1"
directories = "6"
base64 = "0.22"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "rustls-tls",
  "system-proxy",
], default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
flate2 = "1"
regex-lite = "0.1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
