[workspace]
resolver = "2"
members = [
  "crates/maas-media",
  "crates/gateway",
  "apps/desktop",
]

[workspace.package]
version = "3.0.12"
edition = "2024"
repository = "https://github.com/reputationly/ovaijisuandesign"
# 个人学习研究用。仓库公开可读，但没有 license —— 默认版权保留，别人不能直接拿去用。
# `publish = false` 是为了让 `cargo publish` 直接失败，而不是等到上传前才发现没写 license。
publish = false

[workspace.dependencies]
anyhow = "1"
directories = "6"
base64 = "0.22"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "rustls-tls",
  "system-proxy",
], default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
flate2 = "1"
regex-lite = "0.1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
# 飞书长连接的客户端。版本跟着 axum 带进来的那份走，避免同一个 crate 编两遍。
#
# **必须用 rustls 不用 native-tls**：native-tls 在 Linux 上会去链系统的
# OpenSSL，而我们整条链路（reqwest）已经是 rustls，混用意味着两套证书校验
# 和两份根证书。
# WebSocket 的 Sink/Stream 扩展（split / send / next）。只要这两个 trait，
# 不要 futures 全家桶。
# 微信 CDN 上的附件是 AES-128-ECB 加密的。**用 RustCrypto 不自己写** ——
# 分组密码自己实现出来的东西"能解开"和"解对了"是两回事，而错误的实现
# 在测试里往往也能自洽。
aes = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "rustls-tls-webpki-roots",
] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
