summary-en: "Create film or series opening title sequences and 15-second concept teasers ending on the title reveal"
summary-cn: "制作电影或剧集片头标题序列与十五秒影视概念预告，以片名或卡司落板收束"
desc-en: "For filmmakers and series creators who need an opening title sequence, credits sequence, or a single 15-second concept teaser. Takes stills, posters, title text, cast names, or a story premise as input, then routes scope, selects the master style and typography system, confirms exact on-screen text, compiles shots and transitions into a long-form video prompt, and generates the final film with synchronized music. The narrative uses the film world, characters, and conflicts, always closing on the title or cast reveal."
desc-cn: "面向需要影视片头或概念预告的创作者，把剧照、海报、片名、卡司文字或故事设定转化为一条完整的片头标题序列或十五秒影视概念预告。流程覆盖成片范围分流、主风格与文字系统选择、参考素材约束、原创影片方案与准确文字确认、镜头与转场编译、长篇幅视频提示词生成、同步音乐与最终成片交付。叙事以影片世界、人物行动、关系与冲突推进，最终以片名、卡司或预告落板收束，保证文字准确与画面连续。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
