summary-en: "Create a complete anime or game character PV within 15 seconds, from visual lock to final video"
summary-cn: "为二次元游戏与漫画角色制作十五秒内的完整宣传PV，从画风锁定到成片一站完成"
desc-en: "For anime, manga, and game creators who need a single polished character PV within 15 seconds. Takes character art, style references, layout KVs, action clips, or plain ideas as input, then walks through style authority confirmation, color contract, panel and logical-shot storyboarding, a master timeline, prompt compilation, and one full video render. Covers character reveals, awakening scenes, battle teasers, world showcases, and gacha or event promos, with strict identity and palette consistency across every shot."
desc-cn: "面向需要制作二次元角色宣传片的创作者，将角色立绘、三视图、场景或风格参考、排版视觉与创意描述转化为一条十五秒以内的完整PV成片。流程覆盖素材分析与身份锁定、画风来源确认、主题色与强调色合同、语义分镜与逻辑镜头规划、主时间线编排、提示词编译和整条视频生成，支持角色揭示、觉醒、战斗预告、世界观展示与抽卡活动宣传，全程保持角色身份、画风权威与色彩策略的一致性，最终交付单条可直接发布的宣传视频。"
author-en: "Official Design Team"
author-cn: "官方设计团队"
source: official
