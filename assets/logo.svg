<!-- ovaijisuandesign 图标的矢量源。

     从 maas-landingpage/public/ggac.png（628x628）描出来的：没有拿到原始
     矢量文件，用最小二乘把位图边界拟合成「直线 + 正圆弧」，最大偏差 0.8px
     （对 466px 的原图是 0.17%），栅格化回去和原图 IoU 0.986 / 0.993 ——
     已经到抗锯齿边界的噪声底了。

     标本身的几何：两个同心圆（都以画布正中为心），外 R=232.50、内 R=94.33，
     内/外 = 0.406，四片叶片由径向直线连接。落在这两个圆上的弧都吸附到了
     统一的圆心半径，否则各段差零点几像素，放大到 1024 以上边缘会发抖。

     用 A（正圆弧）而不是贝塞尔：这个标是几何构造，圆弧能原样还原，
     路径也短。要改造型的话直接改这里，再跑 scripts/icons.py 出各尺寸。 -->
