<!doctype html>
<!-- 深色变量挂在 .dark 上（和官方一致）。没有这个类，tokens.css 里 :root
     那套浅色会生效 —— 界面其余部分按深色设计，配出来会是"白底 + 深色控件"
     那种一眼就不对但说不出哪不对的样子。 -->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 放 public/ 而不是 src/ 里 import：Vite 会给 src/ 下的资源加内容哈希，
         而 ovgw 是照着 dist/ 原样服务的，favicon 换个名字没影响，但浏览器
         对 /favicon.ico 的兜底请求会 404 —— 顺手多一条无意义的日志。 -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>ovaijisuandesign</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
