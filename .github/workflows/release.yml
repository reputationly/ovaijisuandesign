name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "空跑：只构建 linux-x64，发到 dry-run/ 前缀，跑完清掉"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Windows runner 的 Python 默认 cp1252，脚本里的中文输出会 UnicodeEncodeError。
  # release.py 里也做了兜底，这里是给内联的 python3 heredoc 用的。
  PYTHONUTF8: "1"

jobs:
  # ==================== 版本号与前缀 ====================
  # 独立成 job 让所有下游共用同一份。版本号必须集中解析：包名、latest.json、
  # 二进制自报的版本（env!("CARGO_PKG_VERSION")）三处取值不一致的话，
  # 用户装完立刻会被提示更新到自己刚装的那个版本。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prefix: ${{ steps.v.outputs.prefix }}
      base: ${{ steps.v.outputs.base }}
      matrix: ${{ steps.v.outputs.matrix }}
      cdn: ${{ steps.v.outputs.cdn }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          PUBLIC_BASE: ${{ vars.OVAIJISUAN_PUBLIC_BASE }}
          # secrets 不能在 job 级 if 里判，只能在 step 里转成 output。
          # 桶还没开的时候要能正常发一版：CDN 分发跳过，GitHub Release 照出，
          # 而不是让整个 run 红着——红了就没人再看它到底哪里红。
          HAS_CDN: ${{ secrets.OVAIJISUAN_R2_ENDPOINT != '' && vars.OVAIJISUAN_PUBLIC_BASE != '' }}
        run: |
          echo "cdn=$HAS_CDN" >> "$GITHUB_OUTPUT"
          [ "$HAS_CDN" = "true" ] || echo "::notice::未配置 R2/公开域名，本次跳过 CDN 分发，只出 GitHub Release"
          CARGO=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          BASE="${PUBLIC_BASE%/}"

          # 打包矩阵在这里算，不在 build 的 `if:` 里筛。job 级 `if:` 拿不到
          # `matrix` 上下文（GitHub 要先算完 if 才展开矩阵），写了会让整个
          # workflow 文件校验失败——症状是每次 push 都冒出一个 0 秒的失败 run。
          ALL='[{"os":"macos-latest","targets":"darwin-arm64 darwin-x64"},
                {"os":"windows-latest","targets":"win32-x64"},
                {"os":"ubuntu-latest","targets":"linux-x64"}]'
          # 空跑只打 linux-x64，够验证分发链路了（也是最便宜的 runner）。
          DRY='[{"os":"ubuntu-latest","targets":"linux-x64"}]'

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            {
              echo "version=$CARGO"
              echo "prefix=dry-run/"
              echo "base=$BASE/dry-run"
              echo "matrix=$(echo "$DRY" | jq -c .)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # tag 必须和 Cargo.toml 一致：包名用的是 Cargo.toml 的版本，
          # 而清单里的 URL 按 tag 拼的话两边会对不上，发出去的 latest.json 直接 404。
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag v$TAG 和 Cargo.toml 的 $CARGO 不一致，先同步再发"
            exit 1
          fi
          {
            echo "version=$CARGO"
            echo "prefix="
            echo "base=$BASE"
            echo "matrix=$(echo "$ALL" | jq -c .)"
          } >> "$GITHUB_OUTPUT"

  # ==================== 各平台打包 ====================
  # **一台 macOS runner 出两个架构**：arm64 ⇄ x86_64 能交叉（Xcode 自带两个
  # SDK，连 ring 的 C 代码都能过，本地实测 15 秒）。私仓的 Actions 配额里
  # macOS 是 10 倍计费，省下一台是实打实的。
  #
  # 别的方向交叉不了：rustls 依赖 ring，要目标平台的 SDK 头文件 ——
  # 在 Mac 上试过给 Windows 交叉，卡在 assert.h 找不到。所以 Windows 和
  # Linux 各用自己的 runner。
  build:
    needs: prepare
    strategy:
      fail-fast: false
      # 矩阵由 prepare 算好（空跑时只剩 linux-x64）。见那边的注释。
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    name: 打包 ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2

      - name: 装交叉编译目标
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 打包
        shell: bash
        env:
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          for t in ${{ matrix.targets }}; do
            echo "::group::$t"
            # macOS 上一律走 --cross 显式指定 triple：不指定的话两个架构会
            # 写进同一个 target/release/，第二次构建把第一次的覆盖掉，
            # 而两个包的内容会变成一样的——名字不同、架构相同，装错的人
            # 只会看到"打不开"。
            EXTRA=""
            [ "${{ matrix.os }}" = "macos-latest" ] && EXTRA="--cross"
            # BASE 为空时不传 --base，让脚本用 example.invalid 那个明显是占位的
            # 默认值。传空串会写出 `/0.1.0/…` 这种看着像能用的相对 URL。
            [ -n "$BASE" ] && EXTRA="$EXTRA --base $BASE"
            python3 scripts/release.py --target "$t" $EXTRA
            echo "::endgroup::"
          done

      # 只传 dist/，里面已经是发布布局（版本目录 + latest.json + manifest.json）。
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

  # ==================== 发布 ====================
  # 矩阵由 prepare 动态给出，空跑时不再有被 skip 的 build，所以这里用默认的
  # `success()` 语义就够了——千万别退回 `always()`：它会连「某个平台打包失败」
  # 一起放行，于是 latest 指针照翻，那个平台的用户升级时撞 404，而其余平台
  # 一切正常，问题很难被发现。fail-fast: false 也保证了失败平台一定会被记成
  # failure 而不是 cancelled。
  publish:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.cdn == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.dry_run) }}
    runs-on: ubuntu-latest
    name: 发布
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*

      # 各平台的 dist/ 合并成一份。manifest.json 每个平台都写了自己那一档，
      # 合并时要把 targets 并起来 —— 直接覆盖的话最后一个平台会把别人的抹掉，
      # 表现是"只有一个系统能收到更新"。
      - name: 合并各平台产物
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path("artifacts")
          out = pathlib.Path("dist")
          merged = {"schemaVersion": 1, "targets": {}}
          for d in sorted(root.iterdir()):
              m = d / "manifest.json"
              if m.is_file():
                  merged["targets"].update(json.loads(m.read_text())["targets"])
              for item in d.iterdir():
                  if item.name == "manifest.json":
                      continue
                  dst = out / item.name
                  if item.is_dir():
                      shutil.copytree(item, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, dst)
          out.mkdir(exist_ok=True)
          (out / "manifest.json").write_text(json.dumps(merged, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(merged, indent=2, ensure_ascii=False))
          PY
          find dist -type f | sort

      - name: 上传并回读校验
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OVAIJISUAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OVAIJISUAN_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws cli v2 默认发 CRC32 尾部校验，R2 不支持会直接 501。
          # 这两行不加的话上传第一步就挂，而错误信息完全看不出是校验的问题。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          OVAIJISUAN_R2_ENDPOINT: ${{ secrets.OVAIJISUAN_R2_ENDPOINT }}
          OVAIJISUAN_R2_BUCKET: ${{ secrets.OVAIJISUAN_R2_BUCKET }}
          OVAIJISUAN_OBS_ENDPOINT: ${{ secrets.OVAIJISUAN_OBS_ENDPOINT }}
          OVAIJISUAN_OBS_BUCKET: ${{ secrets.OVAIJISUAN_OBS_BUCKET }}
          OVAIJISUAN_RELEASE_PREFIX: ${{ needs.prepare.outputs.prefix }}
        run: python3 scripts/release.py --publish-only

      # 从**公开域名**再读一次。上一步的校验走的是 S3 API，这一步走 CDN ——
      # 能抓到"传上去了但公网读不到"这类只在真发版时才暴露的问题
      # （自定义域没映射、缓存策略把清单缓住了）。
      - name: 公网回读
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          curl -fsS --retry 3 --retry-delay 2 "$BASE/manifest.json" -o m.json
          echo "--- 缓存响应头 ---"
          curl -fsSI "$BASE/manifest.json" | grep -iE "cache-control|cf-cache-status|content-type" || true
          python3 - <<'PY'
          import json, os, urllib.request
          base, want = os.environ["BASE"], os.environ["VERSION"]
          m = json.load(open("m.json"))
          assert m["targets"], "清单里一个目标都没有"
          for target, entry in m["targets"].items():
              url = next(iter(entry["latestUrls"].values()))
              latest = json.load(urllib.request.urlopen(url, timeout=20))
              assert latest["version"] == want, f"{target}: 清单 {latest['version']} != 期望 {want}"
              # HEAD 一下包本体：清单对了但包传丢了的话，用户点更新才会发现。
              req = urllib.request.Request(latest["url"], method="HEAD")
              size = int(urllib.request.urlopen(req, timeout=20).headers["content-length"])
              assert size == latest["size"], f"{target}: 包大小 {size} != 清单 {latest['size']}"
              print(f"  ✓ {target}  {latest['version']}  {size / 1048576:.1f} MB")
          PY

      # 按「数量」保留而不是用生命周期规则按「天数」：后者有个陷阱 ——
      # 长期不发版时，规则会把当前正在服役的那一版一并删掉。
      #
      # 放在回读之后：确认新版本确实可公开下载，才动旧版本。
      # 不加 always()：前面失败时保持现状，宁可多占空间也不误删。
      - name: 清理旧版本（保留最近 3 个）
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OVAIJISUAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OVAIJISUAN_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: ${{ secrets.OVAIJISUAN_R2_ENDPOINT }}
          BUCKET: ${{ secrets.OVAIJISUAN_R2_BUCKET }}
          CURRENT: ${{ needs.prepare.outputs.version }}
          KEEP: "3"
        run: |
          aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT" \
            | awk '$1=="PRE"{print $2}' | tr -d '/' \
            | grep -E '^[0-9]+(\.[0-9]+)+$' | sort -V > versions.txt || true
          TOTAL=$(wc -l < versions.txt | tr -d ' ')
          [ "$TOTAL" -le "$KEEP" ] && { echo "共 $TOTAL 版，无需清理"; exit 0; }
          head -n "$((TOTAL - KEEP))" versions.txt | while read -r v; do
            # 双保险：绝不删刚发布的这一版
            [ "$v" = "$CURRENT" ] && { echo "跳过当前版本 $v"; continue; }
            echo "删除旧版本 $v"
            aws s3 rm "s3://$BUCKET/$v/" --recursive --endpoint-url "$ENDPOINT"
          done
          echo "保留：$(tail -n "$KEEP" versions.txt | tr '\n' ' ')"

      # 空跑产物不留存。**必须带 always()** —— 否则前面任何一步失败
      # （这恰恰是空跑最可能的结果）本步就被跳过，dry-run/ 残留在桶里，
      # 和「不污染桶」的目标自相矛盾。
      - name: 清理空跑产物
        if: ${{ always() && inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OVAIJISUAN_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OVAIJISUAN_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for pair in \
            "${{ secrets.OVAIJISUAN_R2_ENDPOINT }} ${{ secrets.OVAIJISUAN_R2_BUCKET }}" \
            "${{ secrets.OVAIJISUAN_OBS_ENDPOINT }} ${{ secrets.OVAIJISUAN_OBS_BUCKET }}"; do
            set -- $pair
            [ -n "$1" ] && aws s3 rm "s3://$2/dry-run/" --recursive --endpoint-url "$1" || true
          done
          echo "空跑产物已清理，生产清单未被触碰"

  # ==================== GitHub Release ====================
  github-release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
      - name: 整理并改成能看懂的文件名
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          # 包名是内容哈希（不可变、便于回滚），但挂到 Release 页面上得让人
          # 一眼看出是哪个平台的。
          for f in $(find artifacts -name "*.tar.gz"); do
            target=$(basename "$(dirname "$f")")
            cp "$f" "out/ovaijisuandesign-$VERSION-$target.tar.gz"
          done
          ls -lh out/
      - uses: softprops/action-gh-release@v2
        with:
          name: ovaijisuandesign ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            解压即用，不需要装别的东西。

            | 系统 | 文件 |
            |---|---|
            | macOS (M 系列) | `*-darwin-arm64.tar.gz` |
            | macOS (Intel) | `*-darwin-x64.tar.gz` |
            | Windows | `*-win32-x64.tar.gz` |
            | Linux | `*-linux-x64.tar.gz` |

            ```bash
            tar -xzf ovaijisuandesign-*.tar.gz && ./ovgw
            ```

            首次启动会写一份配置模板，填好 `platform.api_key` 再启动。
            **没有登录流程，key 就是唯一凭据。**

            跑 agent 还需要 [opencode](https://opencode.ai) 在 `PATH` 里。

      # ---------- 把 GitHub Release 本身当成一个分发源 ----------
      # R2/OBS 的桶还没开，但公开仓的 Release 资产本来就是公网可下的不可变对象
      # （版本 tag 一旦发出，资产不会再变），正好满足"包不可变"这一条。
      # 于是升级链路今天就能真跑通，而不是一直停在"代码写完了没试过"。
      #
      # 可变的那一层放在固定 tag `manifest` 的 release 上，每次发版覆盖。
      # 桶开了之后不用改结构：manifest 里多一个源就行，客户端本来就按顺序试。
      #
      # **必须排在上面那步之后**：先有包，再翻指针。反过来的话中间那几十秒里
      # 客户端查到新版本、去下载、404。
      - name: 生成指针（manifest + 各平台 latest）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ptr
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          ver, tag, repo = os.environ["VERSION"], os.environ["TAG"], os.environ["REPO"]
          dl = f"https://github.com/{repo}/releases/download"
          ptr = pathlib.Path("ptr")
          targets = {}

          # 从 build 传上来的 dist/ 里取 target 和真实字节。sha256 重新算一遍
          # 而不是信文件名——文件名是上一个 job 写的，重算一次几乎免费，
          # 而校验和错了的后果是所有人都装不上。
          for f in sorted(pathlib.Path("artifacts").rglob("*.tar.gz")):
              target = f.parent.name
              digest = hashlib.sha256(f.read_bytes()).hexdigest()
              # .stem 对 `x.tar.gz` 给的是 `x.tar`，会永远对不上。
              named = f.name.removesuffix(".tar.gz")
              assert digest == named, f"{f}: 文件名 {named} 和实际 {digest} 对不上"
              (ptr / f"latest-{target}.json").write_text(json.dumps({
                  "version": ver,
                  "url": f"{dl}/{tag}/ovaijisuandesign-{ver}-{target}.tar.gz",
                  "sha256": digest,
                  "size": f.stat().st_size,
              }, indent=2) + "\n")
              targets[target] = {
                  "status": "published",
                  "latestUrls": {"github": f"{dl}/manifest/latest-{target}.json"},
              }

          assert targets, "一个 target 都没有，不要拿空清单去覆盖旧的"
          (ptr / "manifest.json").write_text(json.dumps(
              {"schemaVersion": 1, "targets": targets}, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(targets, indent=2))
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: manifest
          name: 升级指针（不是发行版）
          files: ptr/*
          # 不要抢走版本 release 的"Latest"标记，否则 Release 页面顶上显示的
          # 是这个只有几个 JSON 的条目，用户找不到包。
          make_latest: false
          body: |
            客户端升级检查读的就是这里，**不是给人下载的**。

            - `manifest.json` —— 有哪些平台、各自的 latest 在哪
            - `latest-<平台>.json` —— 当前版本、包地址、sha256、大小

            每次发版被覆盖。包本体在各个版本的 Release 里，发出去就不再改动。
