name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "空跑：只构建 win32-x64，发到 dry-run/ 前缀，跑完清掉"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Windows runner 的 Python 默认 cp1252，脚本里的中文输出会 UnicodeEncodeError。
  # release.py 里也做了兜底，这里是给内联的 python3 heredoc 用的。
  PYTHONUTF8: "1"

jobs:
  # ==================== 版本号与前缀 ====================
  # 独立成 job 让所有下游共用同一份。版本号必须集中解析：包名、latest.json、
  # 二进制自报的版本（env!("CARGO_PKG_VERSION")）三处取值不一致的话，
  # 用户装完立刻会被提示更新到自己刚装的那个版本。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prefix: ${{ steps.v.outputs.prefix }}
      cdn: ${{ steps.v.outputs.cdn }}
      # 产品命名空间。应用端的更新源也用它拼 —— 单一出处，别在 workflow 里再写一遍。
      product: ${{ steps.v.outputs.product }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          # secrets 不能在 job 级 if 里判，只能在 step 里转成 output。
          # 桶还没开的时候要能正常发一版：CDN 分发跳过，GitHub Release 照出，
          # 而不是让整个 run 红着——红了就没人再看它到底哪里红。
          #
          # 判据是 R2 那一组齐没齐。OBS 单独判在 release.py 的 configured()
          # 里：只配了一个源就只发一个，缺一个源不该让整次发布失败。
          HAS_CDN: ${{ secrets.R2_ACCOUNT_ID != '' && vars.R2_PUBLIC_BASE != '' && secrets.R2_ACCESS_KEY_ID != '' }}
        run: |
          echo "cdn=$HAS_CDN" >> "$GITHUB_OUTPUT"
          # PRODUCT 只有一个出处：scripts/release.py。这里 import 出来，
          # 免得改产品名时要同时改 Python 和三处 workflow。
          PRODUCT=$(python3 -c "import sys;sys.path.insert(0,'scripts');import release;print(release.PRODUCT)")
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          [ "$HAS_CDN" = "true" ] || echo "::notice::未配置 R2，本次跳过 CDN 分发，只出 GitHub Release"
          # 三段基线取自**新栈自己的版本源**。以前读的是 workspace 的 Cargo.toml，
          # 旧栈（Rust）删掉之后那个文件就没了。
          CARGO=$(python3 -c "import json;print(json.load(open('app/desktop/package.json'))['version'])")
          echo "版本基线：$CARGO（app/desktop/package.json）"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # 空跑没有 tag，直接用三段基线。产物发到 dry-run/ 前缀，跑完清掉。
            {
              echo "version=$CARGO"
              echo "prefix=dry-run/"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 手动在**分支**上跑（不是从 tag）：出全部三个平台的包，但不发布。
          #
          # 用来看产物体积、验证三个平台都能打出来，而不用先发一版。
          # `publish` 和 `github-release` 两个 job 本来就卡
          # `startsWith(github.ref, 'refs/tags/')`,这条路上它们保持跳过 ——
          # 也就是说这次 run 只产出 artifacts，不对外发任何东西。
          #
          # 版本号用 package.json 的三段基线：这种包不会进分发渠道，
          # 第四段迭代号没有意义。
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::非 tag 触发，出包但不发布（版本 $CARGO）"
            {
              echo "version=$CARGO"
              echo "prefix="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 版本号四段：**前三段跟官方 MiniMax Design 走，第四段是本仓的迭代号。**
          # 三段基线在 app/desktop/package.json（四段不能当 semver 比对），完整版本号
          # 在 tag 里。校验前三段一致 —— 对不上的话包名、清单 URL、二进制自报的
          # 版本会各说各的，发出去的 latest.json 直接 404。
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            "$CARGO"|"$CARGO".*) ;;
            *) echo "::error::tag v$TAG 的前三段和 app/desktop/package.json 的 $CARGO 对不上，先同步再发"; exit 1 ;;
          esac
          if ! echo "$TAG" | grep -qE '^[0-9]+(\.[0-9]+){2,3}$'; then
            # is_newer() 把非数字段按 0 处理，带后缀的版本号会让客户端
            # **静默地永远收不到更新** —— 不报错、不提示。
            echo "::error::版本号必须是纯数字分段：$TAG"; exit 1
          fi
          {
            echo "version=$TAG"
            echo "prefix="
          } >> "$GITHUB_OUTPUT"

  # ==================== 各平台打包 ====================
  # **一台 macOS runner 出两个架构**：arm64 ⇄ x86_64 能交叉（Xcode 自带两个
  # SDK，连 ring 的 C 代码都能过，本地实测 15 秒）。私仓的 Actions 配额里
  # macOS 是 10 倍计费，省下一台是实打实的。
  #
  # 别的方向交叉不了：rustls 依赖 ring，要目标平台的 SDK 头文件 ——
  # 在 Mac 上试过给 Windows 交叉，卡在 assert.h 找不到。所以 Windows 和
  # Linux 各用自己的 runner。
  desktop-electron:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust: aarch64-apple-darwin, target: "--mac --arm64", name: darwin-arm64 }
          - { os: macos-15-intel, rust: x86_64-apple-darwin, target: "--mac --x64", name: darwin-x64 }
          - { os: windows-latest, rust: x86_64-pc-windows-msvc, target: "--win --x64", name: win32-x64 }
    runs-on: ${{ matrix.os }}
    name: 新栈应用包 ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # 两个离线自检（不联网，几秒钟）。平台分支和取件逻辑里有 mac 跑不到的分支，
      # 没有它们就只能靠一整轮试错去撞。
      - name: 平台分支离线自检
        shell: bash
        run: node scripts/verify-platform-branches.mjs
      - name: 取件脚本离线自检
        shell: bash
        run: node scripts/verify-fetch-opencode.mjs

      - name: 取 opencode
        shell: bash
        run: node scripts/fetch-opencode.mjs --target ${{ matrix.rust }}
      - name: 装配 resources 并按 Electron ABI 重编原生模块
        shell: bash
        run: node scripts/stage-desktop-resources.mjs --rebuild
      # 更新源。装好的应用会拿它去读 `<base>/<target>/latest-mac.yml`（发布时写的清单）。
      # 缺了它应用仍然能出包，只是「检查更新」永远查不到东西 —— 所以这里不给就红。
      - name: 出包
        shell: bash
        working-directory: app/desktop
        env:
          OV_UPDATE_FEED_BASE: ${{ vars.R2_PUBLIC_BASE }}/${{ needs.prepare.outputs.product }}
        run: npx --yes electron-builder@26.15.3 ${{ matrix.target }} --publish never
      - name: 核对产物 resources 布局与架构
        shell: bash
        run: node scripts/verify-desktop-package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.name }}
          path: app/desktop/dist-electron/*
          retention-days: 7
          if-no-files-found: error

  # ==================== 新栈发布 ====================
  #
  # 产物形状和旧栈完全不同（dmg/exe + blockmap + electron-updater 的 `latest-*.yml`，
  # 不是 tar.gz + 自定义 latest.json），所以走独立脚本；**但发布源机制是共用的** ——
  # scripts/release-desktop.py 直接 import release.py 的 SOURCES / configured() /
  # s3_upload() / verify()。
  #
  # 于是「配了 OBS_* 就发 OBS、没配就只发 R2」这条语义是**自动继承**的：
  # 现在仓库里 OBS 凭据一个都没有（只有 R2 那组），所以实际只发 R2；将来补上凭据
  # 不用改任何代码，取消下面那几行注释即可。
  publish-electron:
    needs: [prepare, desktop-electron]
    # **这里用 `always()`，但发布本身仍然被卡住。** 两个性质要同时成立：
    #
    #   1. 某个平台打包失败时，**不能**发部分平台 —— 否则 latest 指针照翻，
    #      那个平台的用户升级撞 404，而其余平台一切正常，极难发现。
    #   2. 但**清理空跑产物必须照跑** —— 失败恰恰是空跑最常见的结果，
    #      清理被跳过就等于「空跑在桶里留 800MB」。
    #
    # job 级加 `always()` 只解决第 2 条；第 1 条靠脚本兜底：`release-desktop.py`
    # 在 stage 阶段就要求三个 target 的产物**全都在**，缺一个就硬失败，
    # 而那发生在**任何一次上传之前** —— 所以部分平台发不出去。
    # （代价是构建失败时空跑会红而不是绿，这正是应该红的。）
    if: ${{ always() && needs.prepare.outputs.cdn == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.dry_run) }}
    runs-on: ubuntu-latest
    name: 发布新栈
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: electron-*

      # **这里不要丢 `latest-*.yml`。** 它是 electron-builder 写的更新清单，
      # **输入**正是它 —— 发布阶段靠它重写出新的（换掉里面的 `publish.url` 占位域名）。
      # 旧栈那边「丢掉打包阶段的 `latest.json`」是另一回事：那边那个文件是纯产物，
      # 没有被当成输入重写。
      #
      # 占位域名的问题在 release-desktop.py 里解决：它改的是**摆进 dist-desktop/ 的那份**，
      # 原始文件留在 electron-builder 的输出目录里不上传。另外那里还有一条断言兜底。
      #
      # 只丢 `builder-debug.yml`（构建调试信息，不是发布物）。
      - name: 摆放各平台产物
        run: |
          mkdir -p app/desktop/dist-electron
          python3 - <<'PY'
          import pathlib, shutil
          out = pathlib.Path("app/desktop/dist-electron")
          for d in sorted(pathlib.Path("artifacts").iterdir()):
              for item in d.iterdir():
                  if item.name == "builder-debug.yml":
                      continue
                  dst = out / item.name
                  if item.is_dir():
                      shutil.copytree(item, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, dst)
          PY
          find app/desktop/dist-electron -maxdepth 1 -type f | sort

      - name: 发布并回读校验
        env:
          V: ${{ needs.prepare.outputs.version }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # OBS 那组没配就不给 —— configured() 会自动只发 R2。将来配上取消注释即可。
          # OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
          # OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          # OBS_PUBLIC_BASE: ${{ vars.OBS_PUBLIC_BASE }}
          # OBS_ACCESS_KEY_ID: ${{ secrets.OBS_ACCESS_KEY_ID }}
          # OBS_SECRET_ACCESS_KEY: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          # **空跑必须带 --prefix dry-run/** —— 否则空跑的包会写进生产命名空间，
          # 线上 manifest 指过去的就是一次没验过的发布。旧栈的 prepare 在空跑时
          # 给的就是 `prefix=dry-run/`，这里跟着走同一套。
          PREFIX=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then PREFIX="dry-run/"; fi
          python3 scripts/release-desktop.py \
            --version "$V" \
            --prefix "$PREFIX" \
            --target darwin-arm64 --target darwin-x64 --target win32-x64 \
            --publish

      # 下面两步是从旧栈的 `publish` job 搬过来的。**它们不是可有可无的收尾**：
      # 少了任一步，桶会随着版本数无限涨。

      # 清理旧版本。**每个配置的源都要清** —— 只清 R2 的话 OBS 会随版本数无限涨
      # （mac dmg 260MB ×2 + win exe，一��几十 GB）。旧栈那版只清 R2，注释里写着
      # 「OBS 的清理还没写」，这里补上。
      - name: 清理旧版本（保留最近 3 个）
        if: ${{ !inputs.dry_run }}
        env:
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          NS: ovaijisuandesign
          CURRENT: ${{ needs.prepare.outputs.version }}
          KEEP: "3"
          R2_EP: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OBS_EP: ${{ secrets.OBS_ENDPOINT }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          OBS_KEY: ${{ secrets.OBS_ACCESS_KEY_ID }}
          OBS_SECRET: ${{ secrets.OBS_SECRET_ACCESS_KEY }}
        run: |
          # 配齐了的源。OBS 那组没配就是空串，这里自然跳过 ——
          # 和 release.py 的 configured() 同一套语义。
          SOURCES=()
          [ -n "$R2_EP" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_KEY" ] && \
            SOURCES+=("r2|$R2_EP|$R2_BUCKET|$R2_KEY|$R2_SECRET")
          [ -n "$OBS_EP" ] && [ -n "$OBS_BUCKET" ] && [ -n "$OBS_KEY" ] && \
            SOURCES+=("obs|$OBS_EP|$OBS_BUCKET|$OBS_KEY|$OBS_SECRET")
          if [ "${#SOURCES[@]}" -eq 0 ]; then echo "没有配置任何源，跳过清理"; exit 0; fi
          echo "清理这些源：$(printf '%s ' "${SOURCES[@]%%|*}")"

          # 版本清单取**所有源的并集**。只看一个源的话，某个源独有的旧版会永远清不掉 ——
          # 比如 OBS 配得晚，早先几版只有 R2 有，反过来也一样。
          : > raw.txt
          for s in "${SOURCES[@]}"; do
            IFS='|' read -r name ep bucket key secret <<< "$s"
            aws s3 ls "s3://$bucket/$NS/" --endpoint-url "$ep" \
              --query 'Prefixes[].Prefix' --output text 2>/dev/null \
              | tr -d '/' | grep -E '^[0-9]+(\.[0-9]+)+$' >> raw.txt || true
          done
          sort -Vu raw.txt > versions.txt
          echo "$NS/ 下的版本：$(tr '\n' ' ' < versions.txt)"
          TOTAL=$(wc -l < versions.txt | tr -d ' ')
          [ "$TOTAL" -le "$KEEP" ] && { echo "共 $TOTAL 版，无需清理"; exit 0; }

          # 要删的是「排在 KEEP 之前的」，**每个源都删一遍**。
          # 一个源失败不阻断另一个：删旧版删一半的后果只是某个源多留一份陈旧拷贝，
          # 不影响任何人升级 —— 和发布时「所有目标一起翻指针」不同，那边漏一个就会 404。
          head -n "$((TOTAL - KEEP))" versions.txt | while read -r v; do
            # 双保险：绝不删刚发布的这一版
            [ "$v" = "$CURRENT" ] && { echo "跳过当前版本 $v"; continue; }
            for s in "${SOURCES[@]}"; do
              IFS='|' read -r name ep bucket key secret <<< "$s"
              echo "删除 $s 的 $v"
              AWS_ACCESS_KEY_ID="$key" AWS_SECRET_ACCESS_KEY="$secret" \
                aws s3 rm "s3://$bucket/$NS/$v/" --recursive --endpoint-url "$ep" || \
                echo "  ⚠ $s 删 $v 失败（不影响其他源）"
            done
          done
          echo "保留：$(tail -n "$KEEP" versions.txt | tr '\n' ' ')"

      # 空跑产物不留存。**必须带 always()** —— 否则前面任何一步失败
      # （这恰恰是空跑最可能的结果）本步就被跳过，dry-run/ 残留在桶里，
      # 和「不污染桶」的目标自相矛盾。
      #
      # 放在 `publish-electron` 里而不是独立 job，是因为 `always()` **只保证不被
      # 上游失败跳过、不排序**。之前它待在旧 `publish` job 末尾、又没有 needs 指向
      # 新栈，于是空跑时几秒就跑完了 —— 把上一轮的残留清掉，本轮的 800MB 全留下。
      # 放进本 job 就必然排在发布之后。
      - name: 清理空跑产物
        if: ${{ always() && inputs.dry_run }}
        env:
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # 删的是 <桶>/ovaijisuandesign/dry-run/ —— 带上命名空间，
          # 别去动桶根的 dry-run/，那是 Toonflow 的。
          clean() {  # endpoint bucket key secret
            [ -n "$1" ] && [ -n "$2" ] || return 0
            AWS_ACCESS_KEY_ID="$3" AWS_SECRET_ACCESS_KEY="$4" \
              aws s3 rm "s3://$2/ovaijisuandesign/dry-run/" --recursive --endpoint-url "$1" || true
          }
          clean "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
                "${{ secrets.R2_BUCKET }}" \
                "${{ secrets.R2_ACCESS_KEY_ID }}" "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          clean "${{ secrets.OBS_ENDPOINT }}" "${{ secrets.OBS_BUCKET }}" \
                "${{ secrets.OBS_ACCESS_KEY_ID }}" "${{ secrets.OBS_SECRET_ACCESS_KEY }}"
          echo "空跑产物已清理，生产清单未被触碰"

  # ==================== 发布 ====================
  # 矩阵由 prepare 动态给出，空跑时不再有被 skip 的 build，所以这里用默认的
  # `success()` 语义就够了——千万别退回 `always()`：它会连「某个平台打包失败」
  # 一起放行，于是 latest 指针照翻，那个平台的用户升级时撞 404，而其余平台
  # 一切正常，问题很难被发现。fail-fast: false 也保证了失败平台一定会被记成
  # failure 而不是 cancelled。
