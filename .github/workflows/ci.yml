name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI 上没人看增量编译的收益，关掉省磁盘和缓存体积。
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    # 三个平台都跑。**Windows 是重点** —— 代码里没有平台分支，但在这条
    # 流水线跑起来之前，"支持 Windows" 只是个没验证过的说法。
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # **不能用 --all / --workspace。** `apps/desktop` 是 Tauri，编它要整套
      # WebKitGTK（Linux）和一堆系统库；这个 job 只负责验业务逻辑，为它装
      # 一套 GUI 依赖既慢又和目的无关。桌面端由 release.yml 的 desktop job
      # 在各自平台上真打包时验证。
      #
      # fmt 例外：格式检查不编译，扫全仓是对的。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p gateway -p maas-media --all-targets -- -D warnings

      - name: test
        run: cargo test -p gateway -p maas-media

  # 新栈（app/：Electron + NestJS gateway + mcp-tools + 共享包）。和旧栈并排跑，
  # M10 切换后旧的 rust / bun job 删掉。原生模块（better-sqlite3、sharp）在
  # Windows 上的构建是重点，所以两个平台都跑。
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 43.7.0 内置的是 Node 24.21。
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --continue：一个包失败不要停，其余平台相关的失败一次看全。
      - run: pnpm turbo run build typecheck test --continue

  # ==================== 新栈出包 ====================
  #
  # 验的是「装出来能不能用」，不是「编译过没过」—— 后者 node job 已经管了。
  #
  # **三个 runner，不是三个 target 参数。** `sharp` 的 libvips 和 `better-sqlite3`
  # 的 .node 都是按构建机平台落的预编译：在 arm64 mac 上交叉编 x64，拿到的是 arm64
  # 的二进制，装到 Intel Mac 上第一次碰资产库就炸。所以 mac-arm64 用 macos-latest、
  # mac-x64 用 macos-14（x64 runner）、win-x64 用 windows-latest，各自 stage 各自 rebuild。
  # 这也是旧栈 release 矩阵一直这么排的原因。
  #
  # **先只验产物，不接 publish。** release.yml 的 publish job 认的是旧栈的产物格式
  # （tar.gz），dmg / nsis 走不通；而且 Windows 包目前一行证据都没有，先发出去是害用户。
  package:
    needs: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust: aarch64-apple-darwin, target: "--mac --arm64", label: mac-arm64 }
          - { os: macos-14, rust: x86_64-apple-darwin, target: "--mac --x64", label: mac-x64 }
          - { os: windows-latest, rust: x86_64-pc-windows-msvc, target: "--win --x64", label: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # 取件逻辑的**离线自检**：不联网，用现造的 zip 走一遍真实的解压/校验/落盘路径。
      # 那些坑（魔数、体积、格式匹配、失败不留残骸）全都在这儿钉住 ——
      # 之前它们只能靠押 CI 一轮 8~10 分钟去撞，撞出来五个。
      # Windows 上没有 zip 命令，脚本会跳过造 zip 的那几条并明说。
      - name: 取件脚本离线自检
        shell: bash
        run: node scripts/verify-fetch-opencode.mjs

      # agent runtime。opencode 官方就发这几个平台的包（没有 linux、也没有
      # mac 的 baseline 之外变体）；取不到就**直接红**，不许打个缺 agent 的包 ——
      # 那种包装完是「能启动、能看图、就是没法生成」，用户完全不知道该装什么。
      - name: 取 opencode
        shell: bash
        run: node scripts/fetch-opencode.mjs --target ${{ matrix.rust }}

      # --rebuild：gateway 是用 Electron 自带的 Node 跑的（paths.ts:55），
      # 而 pnpm 装出来的 better-sqlite3 按系统 Node 的 ABI 编。
      - name: 装配 resources 并按 Electron ABI 重编原生模块
        shell: bash
        run: node scripts/stage-desktop-resources.mjs --rebuild

      - name: 出包
        shell: bash
        working-directory: app/desktop
        run: npx --yes electron-builder@26.15.3 ${{ matrix.target }} --publish never

      # 产物对不上契约不会让 electron-builder 报错 —— 它只管把 build-resources 搬过去。
      # 坏掉的症状要等用户装完才发现（agent 起不来 / 首页空白），所以这里逐条断言。
      - name: 核对产物 resources 布局
        shell: bash
        run: node scripts/verify-desktop-package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: app/desktop/dist-electron/*
          retention-days: 7
          if-no-files-found: error

  # 前端和 MCP。这两块没有平台代码，但 bun 在 Windows 上的行为值得盯着 ——
  # `ovagent` 拉起 MCP server 用的就是它。
  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: mcp
        working-directory: mcp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: canvas-web
        working-directory: apps/canvas-web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build

  # 接口规格是从官方产物里提取的，本地跑过就该和仓库里那份一致。
  # 这一步只验脚本本身没写坏 —— CI 上没有 MiniMax Design，提不了真数据。
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/extract-mcp-tools.py').read_text())"
      - name: 规格文档没被手改坏
        run: |
          test "$(grep -cE '^\| `[a-z0-9_]+` \|' docs/mcp-tools.md)" = 54
