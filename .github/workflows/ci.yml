name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI 上没人看增量编译的收益，关掉省磁盘和缓存体积。
  CARGO_INCREMENTAL: 0

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Electron 43.7.0 内置的是 Node 24.21。
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --continue：一个包失败不要停，其余平台相关的失败一次看全。
      - run: pnpm turbo run build typecheck test --continue

  # ==================== 新栈出包 ====================
  #
  # 验的是「装出来能不能用」，不是「编译过没过」—— 后者 node job 已经管了。
  #
  # **三个 runner，不是三个 target 参数。** `sharp` 的 libvips 和 `better-sqlite3`
  # 的 .node 都是按构建机平台落的预编译：在 arm64 mac 上交叉编 x64，拿到的是 arm64
  # 的二进制，装到 Intel Mac 上第一次碰资产库就炸。所以 mac-arm64 用 macos-latest、
  # mac-x64 用 macos-14（x64 runner）、win-x64 用 windows-latest，各自 stage 各自 rebuild。
  # 这也是旧栈 release 矩阵一直这么排的原因。
  #
  # **先只验产物，不接 publish。** release.yml 的 publish job 认的是旧栈的产物格式
  # （tar.gz），dmg / nsis 走不通；而且 Windows 包目前一行证据都没有，先发出去是害用户。
  package:
    # **故意不 depends on `node`。** 打包和测试是两件独立的事：node 挂了一条 5s
    # 超时的 memory 用例，不该让三个平台的出包验证整轮都不跑（`needs` 会直接 skip）。
    # 出包有自己的判据 —— 产物布局对不对，那才是它该回答的问题。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rust: aarch64-apple-darwin, target: "--mac --arm64", label: mac-arm64 }
          # **必须是真 Intel runner。** 曾经写 `macos-14`，而那个 label 现在解析到
          # `macos-14-arm64` 镜像 —— 于是 `--mac --x64` 是在 arm64 机器上交叉编，
          # 产出的 x64 包里面装的是 arm64 原生模块。目录叫 `mac/`、看着像 x64，
          # 布局断言全绿，实际上装到 Intel Mac 上第一次碰资产库就炸。
          # 现在由 verify-desktop-package 拿「app 自己的主二进制」当权威来比对，
          # runner 选错也会红 —— 但更省事的是一开始就选对。
          - { os: macos-15-intel, rust: x86_64-apple-darwin, target: "--mac --x64", label: mac-x64 }
          - { os: windows-latest, rust: x86_64-pc-windows-msvc, target: "--win --x64", label: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 更新源变量必须给到**这一步**：`electron-vite build` 在这里跑，
      # electron.vite.config.ts 的 main.define 也在这里求值。
      # electron-builder 那一步再带也没用 —— 它只打包已经生成好的 out/。
      - run: pnpm turbo run build
        env:
          OV_UPDATE_FEED_BASE: ${{ vars.R2_PUBLIC_BASE }}/ovaijisuandesign

      # 平台相关分支的离线自检：hostTarget / extractCommand / pmCli 三个纯函数，
      # 用 fixture 目录把 mac 和 Windows 的每条分支都跑一遍。
      # **这几个分支在本机（macOS、无 PNPM_HOME）一次都跑不到** —— Windows 上出包
      # 连挂三次全是它们。所以不管在哪个 runner 上，都先跑这个：几秒钟，
      # 换掉一整轮 8~10 分钟的试错。
      - name: 平台分支离线自检
        shell: bash
        run: node scripts/verify-platform-branches.mjs

      # 取件逻辑的**离线自检**：不联网，用现造的 zip 走一遍真实的解压/校验/落盘路径。
      # 那些坑（魔数、体积、格式匹配、失败不留残骸）全都在这儿钉住 ——
      # 之前它们只能靠押 CI 一轮 8~10 分钟去撞，撞出来五个。
      # Windows 上没有 zip 命令，脚本会跳过造 zip 的那几条并明说。
      - name: 取件脚本离线自检
        shell: bash
        run: node scripts/verify-fetch-opencode.mjs

      # agent runtime。opencode 官方就发这几个平台的包（没有 linux、也没有
      # mac 的 baseline 之外变体）；取不到就**直接红**，不许打个缺 agent 的包 ——
      # 那种包装完是「能启动、能看图、就是没法生成」，用户完全不知道该装什么。
      - name: 取 opencode
        shell: bash
        run: node scripts/fetch-opencode.mjs --target ${{ matrix.rust }}

      # --rebuild：gateway 是用 Electron 自带的 Node 跑的（paths.ts:55），
      # 而 pnpm 装出来的 better-sqlite3 按系统 Node 的 ABI 编。
      - name: 装配 resources 并按 Electron ABI 重编原生模块
        shell: bash
        run: node scripts/stage-desktop-resources.mjs --rebuild

      # 这里**不需要**再带更新源变量：`electron-vite build` 已经在上面那步跑完，
      # define 也已经求值完。electron-builder 只负责把生成好的 out/ 打包。
      - name: 出包
        shell: bash
        working-directory: app/desktop
        run: npx --yes electron-builder@26.15.3 ${{ matrix.target }} --publish never

      # 产物对不上契约不会让 electron-builder 报错 —— 它只管把 build-resources 搬过去。
      # 坏掉的症状要等用户装完才发现（agent 起不来 / 首页空白），所以这里逐条断言。
      - name: 核对产物 resources 布局
        shell: bash
        env:
          # 和出包那步同一个值。核对要断言的就是「出包时用的那个更新源真编进去了」。
          OV_UPDATE_FEED_BASE: ${{ vars.R2_PUBLIC_BASE }}/ovaijisuandesign
        run: node scripts/verify-desktop-package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: app/desktop/dist-electron/*
          retention-days: 7
          if-no-files-found: error

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/extract-mcp-tools.py').read_text())"
      # 版本编码自检。**放这儿而不是出包流水线**：它几秒钟跑完、不联网，
      # 而它守的东西一旦坏了，症状是「用户永远收不到更新」——不报错、不提示，
      # 要等真实发布之后才暴露。编码规则和单调性证明在 scripts/versioning.py。
      - name: 版本编码离线自检
        run: python3 scripts/verify-versioning.py
      # 发布布局自检。用的是**线上真实发生过**的夹具：三个 target 各有一份
      # 同名 latest-mac.yml，堆在一层时互相覆盖 —— arm64 于是发布了指向 x64
      # 包名的清单，用户点更新 404 而发布日志全绿。
      # release-desktop.py 只在发版流水线里跑（一轮就是三份几百 MB），
      # 所以这个夹具必须能在 CI 上离线跑。
      - name: 发布布局离线自检
        run: python3 scripts/verify-release-layout.py
      - name: 规格文档没被手改坏
        run: |
          test "$(grep -cE '^\| `[a-z0-9_]+` \|' docs/mcp-tools.md)" = 57
