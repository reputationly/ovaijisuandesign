# 一次性：把已经发出的 30.21.7（当时目录叫 3.0.21.7）挪到 30.21.7/，
# 稳定指针改回去，并删掉误发的 30.21.8。跑完这个文件会删掉。
name: Repoint feed

on:
  workflow_dispatch:

jobs:
  repoint:
    runs-on: ubuntu-latest
    steps:
      - name: 把 30.21.7 设为当前版本
        env:
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EP: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          NS=ovaijisuandesign
          SRC=3.0.21.7
          DST=30.21.7
          # R2 没有 GetObjectTagging。`sync` 会去读标签然后整批失败，大文件一个都拷不过去。
          aws s3 cp "s3://$BUCKET/$NS/$SRC/" "s3://$BUCKET/$NS/$DST/" \
            --recursive --copy-props none --endpoint-url "$EP"

          python3 - << 'PY'
          import os, subprocess, pathlib
          ep = os.environ["EP"]
          bucket = os.environ["BUCKET"]
          ns = "ovaijisuandesign"
          dst = "30.21.7"
          base = os.environ["BASE"].rstrip("/")
          targets = {
              "darwin-arm64": "latest-mac.yml",
              "darwin-x64": "latest-mac.yml",
              "win32-x64": "latest.yml",
          }
          work = pathlib.Path("repoint")
          work.mkdir()
          def aws(*args):
              subprocess.run(["aws", *args, "--endpoint-url", ep], check=True)
          for target, manifest in targets.items():
              prefix = f"{ns}/{dst}/{target}"
              folder = work / target
              folder.mkdir()
              for name in (manifest, "release.json"):
                  path = folder / name
                  aws("s3", "cp", f"s3://{bucket}/{prefix}/{name}", str(path))
                  text = path.read_text(encoding="utf8").replace("3.0.21.7", "30.21.7")
                  path.write_text(text, encoding="utf8")
                  aws("s3", "cp", str(path), f"s3://{bucket}/{prefix}/{name}", "--cache-control", "no-cache")
                  print(f"rewrote {prefix}/{name}")
              stable = work / target / manifest
              aws(
                  "s3", "cp", str(stable), f"s3://{bucket}/{ns}/{target}/{manifest}",
                  "--cache-control", "no-cache",
              )
              print(f"stable {ns}/{target}/{manifest}")
              body = stable.read_text(encoding="utf8")
              if "version: 30.21.7" not in body or "/30.21.7/" not in body:
                  raise SystemExit(f"{manifest} 没有指向 30.21.7")
          PY

          UA='Mozilla/5.0'
          for spec in darwin-arm64/latest-mac.yml darwin-x64/latest-mac.yml win32-x64/latest.yml; do
            url="$BASE/$NS/$spec"
            ok=0
            for i in 1 2 3 4 5 6; do
              body=$(curl -fsSL -A "$UA" --max-time 20 "$url?repin=$i" || true)
              if printf '%s' "$body" | grep -q 'version: 30.21.7' && printf '%s' "$body" | grep -q '/30.21.7/'; then
                echo "✓ $url"
                ok=1
                break
              fi
              echo "还没读到 30.21.7（$i）：${body:0:80}"
              sleep $((i * 3))
            done
            [ "$ok" = 1 ] || { echo "::error::稳定指针没改成 30.21.7：$url"; exit 1; }
          done

          aws s3 rm "s3://$BUCKET/$NS/30.21.8/" --recursive --endpoint-url "$EP"
          aws s3 rm "s3://$BUCKET/$NS/3.0.21.7/" --recursive --endpoint-url "$EP"
          echo "已删 30.21.8 和旧目录 3.0.21.7"
