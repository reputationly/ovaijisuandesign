[package]
name = "gateway"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
description = "本地 gateway。当前只实现生成那几条路由，按官方接口面对齐"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "ovgw"
path = "src/bin/ovgw.rs"

[[bin]]
name = "ovagent"
path = "src/bin/ovagent.rs"

[dependencies]
maas-media = { path = "../maas-media" }

anyhow.workspace = true
axum.workspace = true
directories.workspace = true
flate2.workspace = true
tar.workspace = true
image.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
aes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# 只在 Windows 上编译时用。把 assets/icon.ico 嵌进 exe 的资源段 ——
# 不嵌的话资源管理器和任务栏显示的是那个默认的白纸片。
# 放 target.'cfg(windows)' 下：build.rs 跑在**宿主**上，Windows 的包
# 在 windows runner 上构建，别的平台根本不会拉这个依赖。
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
